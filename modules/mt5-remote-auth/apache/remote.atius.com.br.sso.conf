# Managed by omni-srv-admin modules/mt5-remote-auth.
# Public URL: https://remote.atius.com.br/mt5/<id>/
# Auth gate: local SSO proxy at http://127.0.0.1:8095
<VirtualHost *:9080>
    ServerName remote.atius.com.br
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/remote-mt5-novnc-error.log
    CustomLog ${APACHE_LOG_DIR}/remote-mt5-novnc-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName remote.atius.com.br

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.com.br.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.com.br.key
    SSLStrictSNIVHostCheck off
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300
    Timeout 300
    AllowEncodedSlashes NoDecode

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "remote.atius.com.br"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    RewriteEngine On
    RewriteRule ^/mt5/([A-Za-z0-9_-]+)$ /mt5/$1/ [R=308,L,NE]
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/mt5/([A-Za-z0-9_-]+)/websockify$ ws://127.0.0.1:8095/mt5/$1/websockify [P,L]

    RedirectMatch 302 ^/login/?$ https://sso.atius.com.br/login?return_to=https%3A%2F%2Fremote.atius.com.br%2Fmt5%2F1%2F

    ProxyPass        /mt5/ http://127.0.0.1:8095/mt5/ retry=0 timeout=300 keepalive=On
    ProxyPassReverse /mt5/ http://127.0.0.1:8095/mt5/
    ProxyPassReverseCookiePath / /mt5/

    RedirectMatch 404 ^/$

    ErrorLog ${APACHE_LOG_DIR}/remote-mt5-novnc-error.log
    CustomLog ${APACHE_LOG_DIR}/remote-mt5-novnc-access.log combined
</VirtualHost>
</IfModule>
