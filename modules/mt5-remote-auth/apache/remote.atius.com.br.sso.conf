# Managed by omni-srv-admin modules/mt5-remote-auth.
# Public URL: https://remote.atius.com.br/mt5/<id>/
# Auth gate: local SSO proxy at http://127.0.0.1:8095
<VirtualHost *:9080>
    ServerName remote.atius.com.br
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L,NE]

    ErrorLog ${APACHE_LOG_DIR}/remote-mt5-novnc-error.log
    CustomLog ${APACHE_LOG_DIR}/remote-mt5-novnc-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName remote.atius.com.br

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.com.br.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.com.br.key
    SSLStrictSNIVHostCheck off
    Include /etc/letsencrypt/options-ssl-apache.conf

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 300
    Timeout 300
    AllowEncodedSlashes NoDecode

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "remote.atius.com.br"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s

    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    RewriteEngine On
    RewriteRule ^/mt5/([A-Za-z0-9_-]+)$ /mt5/$1/ [R=308,L,NE]
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/mt5/([A-Za-z0-9_-]+)/websockify$ ws://127.0.0.1:8095/mt5/$1/websockify [P,L]

    ProxyPass        /sso http://127.0.0.1:3015/sso retry=0 timeout=120 keepalive=On
    ProxyPassReverse /sso http://127.0.0.1:3015/sso
    ProxyPass        /login http://127.0.0.1:3015/login retry=0 timeout=120 keepalive=On
    ProxyPassReverse /login http://127.0.0.1:3015/login
    ProxyPass        /_next http://127.0.0.1:3015/_next retry=0 timeout=120 keepalive=On
    ProxyPassReverse /_next http://127.0.0.1:3015/_next
    ProxyPass        /mono-atius-horizontal.svg http://127.0.0.1:3015/mono-atius-horizontal.svg retry=0 timeout=30
    ProxyPassReverse /mono-atius-horizontal.svg http://127.0.0.1:3015/mono-atius-horizontal.svg
    ProxyPass        /hrstc_2.svg http://127.0.0.1:3015/hrstc_2.svg retry=0 timeout=30
    ProxyPassReverse /hrstc_2.svg http://127.0.0.1:3015/hrstc_2.svg
    ProxyPass        /v1/token/generate http://127.0.0.1:3015/v1/token/generate retry=0 timeout=30
    ProxyPassReverse /v1/token/generate http://127.0.0.1:3015/v1/token/generate
    ProxyPass        /v1/auth/me http://127.0.0.1:3015/v1/auth/me retry=0 timeout=30
    ProxyPassReverse /v1/auth/me http://127.0.0.1:3015/v1/auth/me
    ProxyPass        /v1/auth/refresh http://127.0.0.1:3015/v1/auth/refresh retry=0 timeout=30
    ProxyPassReverse /v1/auth/refresh http://127.0.0.1:3015/v1/auth/refresh

    ProxyPass        /logout http://127.0.0.1:8095/logout retry=0 timeout=30
    ProxyPassReverse /logout http://127.0.0.1:8095/logout

    ProxyPass        /mt5/ http://127.0.0.1:8095/mt5/ retry=0 timeout=300 keepalive=On
    ProxyPassReverse /mt5/ http://127.0.0.1:8095/mt5/
    <Location /mt5/>
        ProxyPassReverseCookiePath / /mt5/
    </Location>

    ProxyPass        / http://127.0.0.1:8095/ retry=0 timeout=30
    ProxyPassReverse / http://127.0.0.1:8095/

    ErrorLog ${APACHE_LOG_DIR}/remote-mt5-novnc-error.log
    CustomLog ${APACHE_LOG_DIR}/remote-mt5-novnc-access.log combined
</VirtualHost>
</IfModule>
