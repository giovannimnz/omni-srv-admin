fullnameOverride: omni-monitoring

defaultRules:
  create: true

grafana:
  enabled: true
  defaultDashboardsEnabled: true
  defaultDashboardsTimezone: America/Sao_Paulo
  resources:
    requests:
      cpu: 300m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  initChownData:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 50m
        memory: 64Mi
  sidecar:
    resources:
      requests:
        cpu: 75m
        memory: 64Mi
      limits:
        cpu: 75m
        memory: 128Mi
    dashboards:
      enabled: true
    datasources:
      enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  nodeSelector:
    kubernetes.io/hostname: atius-srv-1

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    retention: 120h
    nodeSelector:
      kubernetes.io/hostname: atius-srv-1
    resources:
      requests:
        cpu: 450m
        memory: 256Mi
      limits:
        cpu: 450m
        memory: 512Mi
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

prometheus:
  enabled: true
  service:
    type: ClusterIP
  ingress:
    enabled: false
  prometheusSpec:
    replicas: 1
    retention: 15d
    retentionSize: 18GiB
    serviceMonitorSelectorNilUsesHelmValues: true
    podMonitorSelectorNilUsesHelmValues: true
    nodeSelector:
      kubernetes.io/hostname: atius-srv-1
    resources:
      requests:
        cpu: 450m
        memory: 768Mi
      limits:
        cpu: 450m
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

kube-state-metrics:
  releaseLabel: true
  resources:
    requests:
      cpu: 500m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

nodeExporter:
  enabled: true
  operatingSystems:
    linux:
      enabled: true
    aix:
      enabled: false
    darwin:
      enabled: false

prometheus-node-exporter:
  releaseLabel: true
  extraArgs:
    - --collector.textfile.directory=/run/omni-textfile
  extraHostVolumeMounts:
    - name: omni-textfile
      hostPath: /home/ubuntu/.local/state/omni/textfile-collector
      type: DirectoryOrCreate
      mountPath: /run/omni-textfile
      readOnly: true
      mountPropagation: None
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: NotIn
                values:
                  - horistic-srv
  resources:
    requests:
      cpu: 500m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

prometheusOperator:
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 50m
        memory: 128Mi
