<VirtualHost *:80>
    ServerName talk.atius.com.br
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog ${APACHE_LOG_DIR}/talk-atius-error.log
    CustomLog ${APACHE_LOG_DIR}/talk-atius-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName talk.atius.com.br

    ProxyPreserveHost On
    ProxyAddHeaders On
    ProxyRequests Off
    ProxyTimeout 60
    RequestHeader set X-Forwarded-Host "talk.atius.com.br"
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass /sso http://127.0.0.1:3015/sso retry=0 timeout=120
    ProxyPassReverse /sso http://127.0.0.1:3015/sso
    ProxyPass /login http://127.0.0.1:3015/login retry=0 timeout=120
    ProxyPassReverse /login http://127.0.0.1:3015/login
    ProxyPass /_next/ http://127.0.0.1:3015/_next/ retry=0 timeout=120
    ProxyPassReverse /_next/ http://127.0.0.1:3015/_next/
    ProxyPass /mono-atius-horizontal.svg http://127.0.0.1:3015/mono-atius-horizontal.svg retry=0 timeout=120
    ProxyPassReverse /mono-atius-horizontal.svg http://127.0.0.1:3015/mono-atius-horizontal.svg
    ProxyPass /hrstc_2.svg http://127.0.0.1:3015/hrstc_2.svg retry=0 timeout=120
    ProxyPassReverse /hrstc_2.svg http://127.0.0.1:3015/hrstc_2.svg
    ProxyPass /v1/ http://127.0.0.1:8015/v1/ retry=0 timeout=120
    ProxyPassReverse /v1/ http://127.0.0.1:8015/v1/
    ProxyPass /api/auth/ http://127.0.0.1:3015/api/auth/ retry=0 timeout=120
    ProxyPassReverse /api/auth/ http://127.0.0.1:3015/api/auth/
    ProxyPass /api/sso/ http://127.0.0.1:3015/api/sso/ retry=0 timeout=120
    ProxyPassReverse /api/sso/ http://127.0.0.1:3015/api/sso/

    ProxyPass / http://127.0.0.1:3101/ retry=0 timeout=60 keepalive=On
    ProxyPassReverse / http://127.0.0.1:3101/

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Cache-Control "no-store" "expr=%{CONTENT_TYPE} =~ m#text/html#"

    ErrorLog ${APACHE_LOG_DIR}/talk-atius-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/talk-atius-ssl-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.com.br.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.com.br.key
    SSLStrictSNIVHostCheck off
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
