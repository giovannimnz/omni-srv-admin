[Unit]
After=oci-admin-env.service oci-admin-mcp-env.service
Requires=oci-admin-env.service oci-admin-mcp-env.service

[Service]
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=read-only
ProtectClock=true
ProtectControlGroups=true
ProtectHostname=true
ProtectKernelLogs=true
ProtectKernelModules=true
ProtectKernelTunables=true
ProtectProc=invisible
RemoveIPC=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
CapabilityBoundingSet=
AmbientCapabilities=
ReadWritePaths=/home/ubuntu/.pm2 /home/ubuntu/.logs/oci-admin /var/lib/oci-admin /run/oci-admin /run/oci-admin-mcp
ExecStartPost=/usr/bin/chmod 0700 /home/ubuntu/.pm2
ExecStartPost=/usr/bin/chmod 0600 /home/ubuntu/.pm2/dump.pm2
