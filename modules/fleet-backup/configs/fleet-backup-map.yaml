# fleet-backup-map.yaml — mapeamento srv_num → host
# Lido por rclone-fleet-queue.sh e sync-backup-script.sh
fleet:
  - srv_num: 1
    hostname: atius-srv-1
    public_ip: 137.131.190.161
    vpn_ip: 10.11.1.11
    ssh_alias: atius-srv-1-vpn
    backup_script: backup-srv1-to-gdrive.sh
    backup_target: giovanni-drive:ATIUS-SRV/SRV-1/Backup/snapshots/
    max_runtime_seconds: 1800
  - srv_num: 2
    hostname: atius-srv-2
    public_ip: 129.148.47.32
    vpn_ip: 10.12.1.12
    ssh_alias: atius-srv-2-vpn
    backup_script: backup-srv2-to-gdrive.sh
    backup_target: giovanni-drive:ATIUS-SRV/SRV-2/Backup/snapshots/
    max_runtime_seconds: 1800
  - srv_num: 3
    hostname: atius-srv-3
    public_ip: 136.248.126.12
    vpn_ip: 10.13.1.13
    ssh_alias: atius-srv-3-vpn
    backup_script: backup-srv3-to-gdrive.sh
    backup_target: giovanni-drive:ATIUS-SRV/SRV-3/Backup/snapshots/
    max_runtime_seconds: 1800

# Contrato isolado da Phase 52. Este bloco nao participa da fila fleet acima,
# nao instala timer e nao autoriza retencao destrutiva.
phase52_copy_only:
  horistic-srv:
    ssh_alias: horistic-srv-1
    mode: copy-only
    state_allowlist:
      - db_v2.sqlite3
    backup_target_prefix: giovanni-drive:ATIUS-SRV/HORISTIC-SRV/Backup/RustDesk/phase52/backup-b/
    transfers: 1
    checkers: 1
    max_runtime_seconds: 900
    bwlimit: 4M
    retention: phase57-pass-plus-30-days
    deletion_requires_new_explicit_approval: true
    install_timer: false

cooldown_seconds: 300
max_retries_per_job: 5
rate_limit_quota_per_minute: 840000
