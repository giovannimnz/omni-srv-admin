<VirtualHost *:80>
    ServerName painel.atius.com.br
    ServerAlias www.painel.atius.com.br
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName painel.atius.com.br
    ServerAlias www.painel.atius.com.br

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.com.br.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.com.br.key
    SSLStrictSNIVHostCheck off
    Include /etc/letsencrypt/options-ssl-apache.conf

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "painel.atius.com.br"

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://127.0.0.1:3015/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:3015/

    ErrorLog ${APACHE_LOG_DIR}/painel.atius.com.br_error.log
    CustomLog ${APACHE_LOG_DIR}/painel.atius.com.br_access.log combined
</VirtualHost>
