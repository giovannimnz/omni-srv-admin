<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName docker.atius.com.br

    ProxyPreserveHost On

    ProxyRequests Off

    # Disable SSL verification for backend (self-signed cert)
    SSLProxyEngine On
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off

    # Important headers for Portainer behind reverse proxy
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader unset Authorization

    # WebSocket support - using wss for secure websocket
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:8210/$1" [P,L]

    # Regular proxy to HTTPS
    ProxyPass / http://127.0.0.1:8210/
    ProxyPassReverse / http://127.0.0.1:8210/

    # Increase timeout for API calls
    ProxyTimeout 600
    Timeout 600

    ErrorLog ${APACHE_LOG_DIR}/portainer_http_error.log
    CustomLog ${APACHE_LOG_DIR}/portainer_http_access.log combined

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.com.br.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.com.br.key
    SSLStrictSNIVHostCheck off
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
