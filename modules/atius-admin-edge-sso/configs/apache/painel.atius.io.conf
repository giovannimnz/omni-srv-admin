<VirtualHost *:80>
    ServerName painel.atius.io
    ServerAlias www.painel.atius.io
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName painel.atius.io
    ServerAlias www.painel.atius.io

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.io.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.io.key
    SSLStrictSNIVHostCheck off
    Include /etc/letsencrypt/options-ssl-apache.conf

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "painel.atius.io"

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://127.0.0.1:3015/ retry=0 timeout=120
    ProxyPassReverse / http://127.0.0.1:3015/

    ErrorLog ${APACHE_LOG_DIR}/painel.atius.io_error.log
    CustomLog ${APACHE_LOG_DIR}/painel.atius.io_access.log combined
</VirtualHost>
