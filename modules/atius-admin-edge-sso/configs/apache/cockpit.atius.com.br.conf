<VirtualHost *:80>
    ServerName cockpit.atius.com.br
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:9080>
    ServerName cockpit.atius.com.br
    Redirect permanent / https://cockpit.atius.com.br/
</VirtualHost>

<VirtualHost *:443>
    ServerName cockpit.atius.com.br

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.com.br.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.com.br.key
    SSLStrictSNIVHostCheck off
    Include /etc/letsencrypt/options-ssl-apache.conf

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:8210/$1 [P,L]

    ProxyPass / http://127.0.0.1:8210/ retry=0
    ProxyPassReverse / http://127.0.0.1:8210/

    ErrorLog ${APACHE_LOG_DIR}/cockpit.atius.com.br_error.log
    CustomLog ${APACHE_LOG_DIR}/cockpit.atius.com.br_access.log combined
</VirtualHost>

<VirtualHost *:9444>
    ServerName cockpit.atius.com.br

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.com.br.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.com.br.key
