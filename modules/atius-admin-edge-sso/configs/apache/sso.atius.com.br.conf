# Canonical Apache VirtualHost for sso.atius.com.br
# Routes via Atius Admin Edge Gateway (127.0.0.1:8210) -> Keycloak SSO Admin & IAM Gateway (http://127.0.0.1:8015)
<VirtualHost *:80>
    ServerName sso.atius.com.br
    ServerAlias www.sso.atius.com.br
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:9080>
    ServerName sso.atius.com.br
    ServerAlias www.sso.atius.com.br
    Redirect permanent / https://sso.atius.com.br/
</VirtualHost>

<VirtualHost *:443>
    ServerName sso.atius.com.br
    ServerAlias www.sso.atius.com.br

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.com.br.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.com.br.key
    SSLStrictSNIVHostCheck off
    Include /etc/letsencrypt/options-ssl-apache.conf

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Atius-Upstream-Target "http://127.0.0.1:8015"

    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:8210/$1 [P,L]

    ProxyPass / http://127.0.0.1:8210/ retry=0
    ProxyPassReverse / http://127.0.0.1:8210/

    ErrorLog ${APACHE_LOG_DIR}/sso.atius.com.br_error.log
    CustomLog ${APACHE_LOG_DIR}/sso.atius.com.br_access.log combined
</VirtualHost>

<VirtualHost *:9444>
    ServerName sso.atius.com.br
    ServerAlias www.sso.atius.com.br

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.com.br.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.com.br.key
    SSLStrictSNIVHostCheck off
    Include /etc/letsencrypt/options-ssl-apache.conf

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Atius-Upstream-Target "http://127.0.0.1:8015"

    ProxyPreserveHost On
    ProxyRequests Off

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:8210/$1 [P,L]

    ProxyPass / http://127.0.0.1:8210/ retry=0
    ProxyPassReverse / http://127.0.0.1:8210/

    ErrorLog ${APACHE_LOG_DIR}/sso.atius.com.br_error.log
    CustomLog ${APACHE_LOG_DIR}/sso.atius.com.br_access.log combined
</VirtualHost>
