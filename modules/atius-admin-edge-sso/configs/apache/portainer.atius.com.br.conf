<VirtualHost *:9080>
    ServerName portainer.atius.com.br

    # Redirect HTTP to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName portainer.atius.com.br

    ProxyPreserveHost On

    ProxyRequests Off
    SSLProxyEngine On
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    SSLProxyCheckPeerExpire off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader unset Authorization
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:8210/$1 [P,L]
    ProxyPass / http://127.0.0.1:8210/
    ProxyPassReverse / http://127.0.0.1:8210/

    # SSL Configuration (assuming certificates are in /etc/letsencrypt/live/portainer.atius.com.br/)
    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.com.br.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.com.br.key
    SSLStrictSNIVHostCheck off
    Include /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog ${APACHE_LOG_DIR}/portainer.atius.com.br-error.log
    CustomLog ${APACHE_LOG_DIR}/portainer.atius.com.br-access.log combined
</VirtualHost>
