<VirtualHost *:9080>
    ServerName grafana.atius.com.br
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName grafana.atius.com.br

    ProxyPreserveHost On

    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader unset Authorization

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://127.0.0.1:8210/$1 [P,L]

    ProxyPass / http://127.0.0.1:8210/
    ProxyPassReverse / http://127.0.0.1:8210/

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.com.br.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.com.br.key
    SSLStrictSNIVHostCheck off
    Include /etc/letsencrypt/options-ssl-apache.conf

    ErrorLog ${APACHE_LOG_DIR}/grafana.atius.com.br-error.log
    CustomLog ${APACHE_LOG_DIR}/grafana.atius.com.br-access.log combined
</VirtualHost>
