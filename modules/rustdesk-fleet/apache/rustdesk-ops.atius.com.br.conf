# Managed-By: omni-srv-admin/rustdesk-fleet/phase53
# HTTPS-only ATIUS operational surface; not a RustDesk native API endpoint.
<VirtualHost *:443>
    ServerName rustdesk-ops.atius.com.br

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/rustdesk-ops.atius.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rustdesk-ops.atius.com.br/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:32113/ connectiontimeout=3 timeout=10
    ProxyPassReverse / http://127.0.0.1:32113/
    RequestHeader unset Proxy early

    LogFormat "%a %t \"%m %U %H\" %>s %b" atius_rustdesk_ops_sanitized
    CustomLog ${APACHE_LOG_DIR}/rustdesk-ops-access.log atius_rustdesk_ops_sanitized
    ErrorLog ${APACHE_LOG_DIR}/rustdesk-ops-error.log
</VirtualHost>
