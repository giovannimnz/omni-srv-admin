project: notebooklm-py
enabled: true
upstream: https://github.com/teng-lin/notebooklm-py.git
upstream_branch: main
origin_branch: main
fork_repo: notebooklm-py
fork: /home/ubuntu/GitHub/forks/notebooklm-py
auto_push: true

# No local fork-owned files are protected yet.
# Add paths here only after they exist in the fork, otherwise dry-runs become noisy.
protected_paths: []

merge_strategy: merge
notification_level: all
ai_decision_threshold: conflicts
version_scheme:
  suffix: "-rf"
  counter_dir: "~/.fork-sync/{project}/versions/{upstream_version}"

related_repos:
  bridge: https://github.com/giovannimnz/notebooklm-obsidian-bridge
