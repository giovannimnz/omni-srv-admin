# Horus Spec Driven — fork-sync configuration
# Project: horus-spec-driven v4.1
# Wrapper over open-gsd/gsd-core with 3-role unified commands
#
# 67 upstream commands → dev/pm/qa + config
#
# REGRA DE FILTRAGEM AUTOMÁTICA:
#   Todo comando upstream cujo nome contenha termo após "Ultra" no dicionário
#   de níveis (wenyan-*, ultra-*, extreme-*, etc.) é automaticamente removido
#   durante o build da wordlist. Esta regra é aplicada em bin/rebrand.js.
#
#   Níveis válidos: lite, full, ultra
#   Níveis removidos: wenyan-lite, wenyan-full, wenyan-ultra, extreme,
#                      maximum, insane, godmode, e quaisquer outros
#                      adicionados pelo upstream após "ultra"

project: Horus-Spec-Driven
enabled: false
paused: true
pause_reason: "Custom submodule sync uses Horus installer; disabled in generic daily fork-sync until custom runner support is implemented."
display_name: "Horus Spec Driven — Multi-CLI Wrapper for GSD Core"

upstream_type: submodule
submodule_path: modules/gsd-core
upstream_url: https://github.com/open-gsd/gsd-core
upstream_branch: main

fork: /home/ubuntu/GitHub/SDD/horus-spec-driven
fork_branch: master
fork_origin: https://github.com/giovannimnz/horus-spec-driven

# ── Protected paths (NUNCA sobrescritos) ───────────────────────
protected_paths:
  - bin/lib/horus-sdk-adapter/
  - bin/lib/content-converters/
  - bin/lib/frontmatter-converters/
  - bin/lib/subagent-adapter/
  - bin/lib/layout.js
  - bin/rebrand.js
  - bin/build-unified-skills.cjs
  - bin/install.js
  - bin/sync.js
  - runtimes/
  - locales/
  - docs/
  - horus-spec-driven.json
  - README.md
  - README-en.md
  - SETUP.md
  - CHANGELOG.md
  - LICENSE
  - modules/README.md

# ── Filtro de comandos upstream ─────────────────────────────────
upstream_filter:
  enabled: true
  description: "Remove comandos com níveis além de Ultra (wenyan-*, extreme-*, etc.)"
  rule: "strip_levels_beyond_ultra"
  levels:
    valid: ["lite", "full", "ultra"]
    strip:
      - "wenyan-lite"
      - "wenyan-full"
      - "wenyan-ultra"
      - "extreme"
      - "maximum"
      - "insane"
      - "godmode"

merge_strategy: custom
merge_script: /home/ubuntu/GitHub/horus-spec-driven/bin/install.js
merge_args: ["sync", "--all", "--global"]
merge_description: |
  1. git submodule update --remote modules/gsd-core
  2. Build unified wordlist (gsd-X → hsd-{role}) + upstream_filter
  3. Apply content + frontmatter converters per runtime
  4. Install em Hermes (skills/hsd/), Claude, Codex, Gemini, Copilot
  5. Install horus-sdk-adapter + agentes de role

deploy:
  enabled: true
  method: cli
  targets:
    - runtime: hermes
      home: ~/.hermes
      mode: global
      dest_subpath: skills/hsd
    - runtime: claude
      home: ~/.claude
      mode: global
  post_deploy:
    - "node ~/GitHub/horus-spec-driven/bin/install.js detect"

notification_level: all
ai_decision_threshold: important

# ── Slash Commands (3 roles + config) ──────────────────────────
unified_commands:
  dev:
    - hsd-dev       # discover define plan build debug maintain ui
  pm:
    - hsd-pm        # new track ship config manage
  qa:
    - hsd-qa        # validate audit review
  config:
    - hsd-config    # language compression agents
