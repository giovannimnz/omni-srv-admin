# Horus Spec Driven — fork-sync configuration
# Project: horus-spec-driven
# Wrapper over open-gsd/gsd-core with role-based unified commands
#
# 67 upstream commands → 3 roles + config hsd commands (75% reduction)
# Categories: PO (Product Owner), PM (Project Manager), FRONT, BACK, QA

project: Horus-Spec-Driven
display_name: "Horus Spec Driven — Multi-CLI Wrapper for GSD Core"

upstream_type: vendor
vendor_source: https://github.com/open-gsd/gsd-core
vendor_branch: main
vendor_method: "shallow clone (git clone --depth 1)"

fork: /home/ubuntu/GitHub/horus-spec-driven
fork_branch: master
fork_origin: https://github.com/giovannimnz/horus-spec-driven

# ── Protected paths (NUNCA sobrescritos) ───────────────────────
protected_paths:
  - bin/lib/horus-sdk-adapter/
  - bin/lib/content-converters/
  - bin/lib/frontmatter-converters/
  - bin/lib/subagent-adapter/
  - bin/lib/layout.js
  - bin/rebrand.js
  - bin/install.js
  - bin/sync.js
  - runtimes/
  - docs/
  - spec-horus.json
  - README.md
  - SETUP.md
  - CHANGELOG.md
  - LICENSE

merge_strategy: custom
merge_script: /home/ubuntu/GitHub/horus-spec-driven/bin/install.js
merge_args: ["sync", "--all", "--global"]
merge_description: |
  1. Pull gsd-core latest (git clone --depth 1)
  2. Build unified wordlist (gsd-X → hsd-{role}-Y)
  3. Apply content + frontmatter converters per runtime
  4. Install em Hermes (skills/hsd/), Claude, Codex, Gemini, Copilot
  5. Install horus-sdk-adapter skill

deploy:
  enabled: true
  method: cli
  targets:
    - runtime: hermes
      home: ~/.hermes
      mode: global
      dest_subpath: skills/hsd
    - runtime: claude
      home: ~/.claude
      mode: global
  post_deploy:
    - "node ~/GitHub/horus-spec-driven/bin/install.js detect"

notification_level: all
ai_decision_threshold: important

# ── Slash Commands (3 roles + config) ─────────────────────────────────
unified_commands:
  po:  # Product Owner
    - hsd-po-discover   # explore, spike, sketch, capture, map-codebase
    - hsd-po-new        # new-project, new-milestone
    - hsd-po-define     # discuss-phase, spec-phase, mvp-phase
    - hsd-po-inbox      # inbox
  pm:  # Project Manager
    - hsd-pm-plan       # plan-phase, ultraplan-phase, ai-integration-phase
    - hsd-pm-exec       # execute-phase, autonomous, quick, fast
    - hsd-pm-track      # progress, workstreams, thread, phase, stats, graphify
    - hsd-pm-config     # config, settings, profile-user
    - hsd-pm-ship       # ship, pr-branch, complete-milestone, milestone-summary
    - hsd-pm-manage     # manager, surface, pause-work, resume-work, help
  front:  # Frontend
    - hsd-front-ui      # ui-phase, ui-review
  back:  # Backend
    - hsd-back-debug    # debug, forensics
    - hsd-back-maintain # docs-update, extract-learnings, ingest-docs, import, cleanup
    - hsd-back-context  # ns-context
  qa:  # Quality Assurance
    - hsd-qa-validate   # validate-phase, verify-work, health, add-tests
    - hsd-qa-audit      # audit-fix, audit-milestone, audit-uat
    - hsd-qa-review     # code-review, eval-review, review, review-backlog, secure-phase
