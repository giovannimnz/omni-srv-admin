project: Atius Router
upstream: https://github.com/QuantumNous/new-api
upstream_branch: main
origin_branch: main
fork_repo: router-ai-atius  # slug real no GitHub (display name "Atius Router" diverge)
fork: /home/ubuntu/GitHub/containers/router-ai-atius
auto_push: true

# Container migration note:
# The live Podman containers bind to /home/ubuntu/GitHub/containers/router-ai-atius.
# The older /home/ubuntu/docker/Atius/router-ai-atius symlink points at
# /home/ubuntu/GitHub/containers/Atius/router-ai-atius and is no longer the
# runtime source of truth for this host.
container_mirror: /home/ubuntu/GitHub/containers/router-ai-atius
container_mirror_status: repaired_git_worktree
legacy_container_mirror: /home/ubuntu/GitHub/containers/Atius/router-ai-atius

protected_paths:
  # Feature: retired middleware artifacts must not become canonical runtime again
  - integration/middleware/
  - runtime/model-detailed/
  - Dockerfile.fastapi
  # Feature: Docker/Podman config; /v1 runtime is Go-only in production
  - docker-compose.yml
  - podman-compose.yml
  # Feature: i18n Brazilian Portuguese
  - i18n/locales/pt.yaml
  - i18n/i18n.go
  - web/default/src/i18n/locales/*.json
  - web/default/src/i18n/config.ts
  # Feature: Codex channel, OAuth/device/model sync and routing overrides
  - controller/codex_*.go
  - service/codex_*.go
  - relay/channel/codex/
  - relay/channel/minimax/
  - relay/channel/deepseek/
  - relay/common/relay_utils.go
  - relay/common/relay_utils_test.go
  - relay/embedding_handler.go
  - service/openaicompat/policy.go
  - service/embeddinggovernor/
  - constant/channel.go
  - common/endpoint_type.go
  - common/endpoint_type_test.go
  - dto/embedding.go
  - dto/channel_settings.go
  - router/api-router.go
  - web/default/src/features/channels/
  - web/default/scripts/sync-i18n.mjs
  - web/classic/src/constants/channel.constants.js
  # Feature: Go-native model catalog, base URL normalization and Codex embeddings route
  - .dockerignore
  - controller/model.go
  - controller/model_list_test.go
  - service/modelcatalog/
  # Feature: Provider consolidation operational CLI guards
  - tools/clianything.py
  - tests/test_clianything.py
  # Feature: Documentation and planning
  - README.md
  - README.en.md
  - docs/
  - .planning/
  # Feature: versioning and branding
  - VERSION
  - web/default/public/logo.png
  - web/default/public/favicon.ico

merge_strategy: theirs
version_scheme: "v{upstream_version}-rf{N}"
notification_level: all
ai_decision_threshold: conflicts
