project: atius-router
image: ghcr.io/giovannimnz/router-ai-atius
docker_compose_path: /home/ubuntu/GitHub/containers/router-ai-atius
container_name: router-ai-atius
health_endpoint: https://router.atius.com.br/health
health_token: ""  # Set via env or secret manager
middleware_container_name: model-detailed-hotfix
middleware_runtime_file: /home/ubuntu/GitHub/containers/router-ai-atius/runtime/model-detailed/model_detailed_fastapi.py
middleware_health_endpoint: https://router.atius.com.br/health
middleware_rate_queue:
  enabled_env: ATIUS_RATE_QUEUE_ENABLED
  default_max_wait_seconds: 45
  default_max_retries: 2
  minimax_chat_interval_seconds: 1.5
  minimax_embeddings_interval_seconds: 5.0
  deepseek_chat_interval_seconds: 0.5
  codex_chat_interval_seconds: 0.5
  openai_embeddings_interval_seconds: 1.0
platforms:
  - linux/arm64
  - linux/amd64
