project: bruno
enabled: false
paused: true
pause_reason: "Local fork path missing on SRV-1; giovannimnz/bruno exists but must be cloned/re-homed before sync."
upstream: https://github.com/usebruno/bruno
upstream_branch: main
origin_branch: main
fork: /home/ubuntu/GitHub/forks/bruno
protected_paths:
  # Custom collections e environments
  - collections/
  - environments/
  - README.md
merge_strategy: merge
auto_push: true
notification_level: all
ai_decision_threshold: conflicts
version_scheme:
  suffix: "-rf"
  counter_dir: "~/.fork-sync/{project}/versions/{upstream_version}"
