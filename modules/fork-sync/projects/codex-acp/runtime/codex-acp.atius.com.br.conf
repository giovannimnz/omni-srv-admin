<VirtualHost *:9080>
    ServerName codex-acp.atius.com.br
    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
    ErrorLog ${APACHE_LOG_DIR}/codex-acp-error.log
    CustomLog ${APACHE_LOG_DIR}/codex-acp-access.log combined
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName codex-acp.atius.com.br
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 7200
    ProxyAddHeaders On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "codex-acp.atius.com.br"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/gateway/?(.*)$ ws://10.13.1.13:18789/$1 [P,L]

    ProxyPass /gateway ws://10.13.1.13:18789/ retry=0 timeout=7200
    ProxyPassReverse /gateway ws://10.13.1.13:18789/

    <Location "/">
        Require all granted
    </Location>

    ErrorLog ${APACHE_LOG_DIR}/codex-acp-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/codex-acp-ssl-access.log combined
    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.com.br.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.com.br.key
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
