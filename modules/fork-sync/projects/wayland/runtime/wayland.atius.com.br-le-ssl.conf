<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName wayland.atius.com.br

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyTimeout 600
    ProxyAddHeaders On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "wayland.atius.com.br"

    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/(.*)$ ws://10.13.1.13:25725/$1 [P,L]

    ProxyPass / http://10.13.1.13:25725/ retry=0 timeout=600 keepalive=On
    ProxyPassReverse / http://10.13.1.13:25725/

    ErrorLog ${APACHE_LOG_DIR}/wayland-error.log
    CustomLog ${APACHE_LOG_DIR}/wayland-access.log combined

    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.com.br.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.com.br.key
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
