project: hermes-backend
enabled: false
paused: true
pause_reason: "User requested hermes-os paused for now on 2026-06-13."
display_name: "Hermes Backend — fork module inside hermes-os"
upstream: https://github.com/NousResearch/hermes-agent
upstream_branch: main
origin_branch: main
fork: /home/ubuntu/GitHub/hermes-os/hermes-backend
merge_strategy: merge
auto_push: false
notification_level: all
ai_decision_threshold: conflicts
version_scheme:
  suffix: "-hb"
  counter_dir: "~/.fork-sync/{project}/versions/{upstream_version}"

protected_paths:
  - .planning/
  - PANORAMA-FORK-2026-06-01.md
  - CLAUDE.md
  - AGENTS.md
  - plugins/hermes-postgres-memory/
  - skills/
  - hermes_state.py

post_sync:
  enabled: false
  description: "Backend sync only; follow-up validation/build handled by repo-level orchestration"
