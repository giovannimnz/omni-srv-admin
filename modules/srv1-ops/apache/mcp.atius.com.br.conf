# Versioned edge contract for mcp.atius.com.br.
# Include this fragment inside the canonical TLS vhost; it is not a standalone
# replacement for the production vhost.
ProxyPreserveHost On
ProxyRequests Off
ProxyTimeout 120
RequestHeader set X-Forwarded-Proto "https"

<LocationMatch "^/(?:oci-admin|gbrain|obsidian)(?:/|$)">
    LimitRequestBody 262144
    RequestReadTimeout header=10-20,MinRate=500 body=10,MinRate=500
    Header always unset Allow
    Header always set Allow "POST" "expr=%{REQUEST_STATUS} == 405"
</LocationMatch>

# retry=0 prevents a disconnected mutating request from being replayed.
ProxyPass        /oci-admin/ http://10.13.1.13:8090/ retry=0 timeout=120 connectiontimeout=5 keepalive=On
ProxyPassReverse /oci-admin/ http://10.13.1.13:8090/
ProxyPass        /gbrain/ http://127.0.0.1:3131/ retry=0 timeout=120 connectiontimeout=5 keepalive=On
ProxyPassReverse /gbrain/ http://127.0.0.1:3131/
ProxyPass        /obsidian/ https://10.11.1.11:27124/ retry=0 timeout=120 connectiontimeout=5 keepalive=On
ProxyPassReverse /obsidian/ https://10.11.1.11:27124/
