<VirtualHost *:80>
    ServerName gitlab.atius.io
    ServerAlias gitlab-dev.atius.io pipelinedev.atius.io pipeline.atius.io
    RewriteEngine On
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName gitlab.atius.io
    ServerAlias gitlab-dev.atius.io pipelinedev.atius.io pipeline.atius.io
    SSLEngine on
    SSLCertificateFile /etc/ssl/cloudflare/atius.io.pem
    SSLCertificateKeyFile /etc/ssl/cloudflare/atius.io.key
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Ssl "on"
    RequestHeader set X-Forwarded-For %{REMOTE_ADDR}s

    # Same-Host Login Facade (Atius SSO PM2 Gold Standard)
    ProxyPass /_atius/ http://127.0.0.1:8930/_atius/ retry=0 timeout=10
    ProxyPassReverse /_atius/ http://127.0.0.1:8930/_atius/

    ProxyPass /login http://127.0.0.1:8930/login retry=0 timeout=30
    ProxyPassReverse /login http://127.0.0.1:8930/login

    RewriteEngine On
    RewriteRule ^/users/sign_in/?$ /login [R=302,L]

    ProxyPass / http://10.14.1.14:8929/ retry=0 timeout=300
    ProxyPassReverse / http://10.14.1.14:8929/

    ErrorLog ${APACHE_LOG_DIR}/gitlab-io-error.log
    CustomLog ${APACHE_LOG_DIR}/gitlab-io-access.log combined
</VirtualHost>
</IfModule>
