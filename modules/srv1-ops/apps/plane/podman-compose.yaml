x-db-env: &db-env
  PGHOST: ${PGHOST:-plane-db}
  PGDATABASE: ${PGDATABASE:-plane}
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  PGDATA: ${PGDATA:-/var/lib/postgresql/data}

x-redis-env: &redis-env
  REDIS_HOST: ${REDIS_HOST:-plane-redis}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}

x-minio-env: &minio-env
  MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
  MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ${AWS_REGION:-}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}

x-proxy-env: &proxy-env
  APP_DOMAIN: ${APP_DOMAIN:-localhost}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  # CERT_EMAIL: ${CERT_EMAIL}
  # CERT_ACME_CA: ${CERT_ACME_CA}
  # CERT_ACME_DNS: ${CERT_ACME_DNS}
  LISTEN_HTTP_PORT: ${LISTEN_HTTP_PORT:-80}
  LISTEN_HTTPS_PORT: ${LISTEN_HTTPS_PORT:-443}
  BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  SITE_ADDRESS: ${SITE_ADDRESS:-:80}

x-mq-env:
  # RabbitMQ Settings
  &mq-env
  RABBITMQ_HOST: ${RABBITMQ_HOST:-plane-mq}
  RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
  RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
  RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}

x-live-env: &live-env
  API_BASE_URL: ${API_BASE_URL:-http://api:8000}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?LIVE_SERVER_SECRET_KEY is required}

x-app-env: &app-env
  WEB_URL: ${WEB_URL:-http://localhost}
  DEBUG: ${DEBUG:-0}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  GUNICORN_WORKERS: 1
  USE_MINIO: ${USE_MINIO:-1}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  AMQP_URL: ${AMQP_URL:?AMQP_URL is required}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?LIVE_SERVER_SECRET_KEY is required}

services:
  web:
    image: docker.io/makeplane/plane-frontend:${APP_RELEASE:-v1.3.1}
    ports:
      - "8080:80"
    deploy:
      replicas: ${WEB_REPLICAS:-1}
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.25"
    depends_on:
      - api
      - worker
    extra_hosts:
      - "api:10.89.1.20"
      - "worker:10.89.1.21"
      - "beat-worker:10.89.1.22"
      - "plane-db:10.89.1.2"
      - "plane-redis:10.89.1.3"
      - "plane-mq:10.89.1.4"
      - "plane-minio:10.89.1.5"
    networks:
      atius:
        ipv4_address: 10.89.1.10

  space:
    image: docker.io/makeplane/plane-space:${APP_RELEASE:-v1.3.1}
    healthcheck:
      test: ["CMD-SHELL", "wget -S --spider http://127.0.0.1:3000/ 2>&1 | grep -Eq 'HTTP/[0-9.]+ [1-4][0-9][0-9]'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      replicas: ${SPACE_REPLICAS:-1}
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.25"
    depends_on:
      - api
      - worker
      - web
    extra_hosts:
      - "api:10.89.1.20"
      - "web:10.89.1.10"
    networks:
      atius:
        ipv4_address: 10.89.1.11

  admin:
    image: docker.io/makeplane/plane-admin:${APP_RELEASE:-v1.3.1}
    deploy:
      replicas: ${ADMIN_REPLICAS:-1}
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.25"
    depends_on:
      - api
      - web
    extra_hosts:
      - "api:10.89.1.20"
      - "web:10.89.1.10"
    networks:
      atius:
        ipv4_address: 10.89.1.12

  live:
    image: docker.io/makeplane/plane-live:${APP_RELEASE:-v1.3.1}
    environment:
      <<: [ *live-env, *redis-env ]
    deploy:
      replicas: ${LIVE_REPLICAS:-1}
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.25"
    depends_on:
      - api
      - web
    extra_hosts:
      - "api:10.89.1.20"
      - "web:10.89.1.10"
      - "plane-redis:10.89.1.3"
    networks:
      atius:
        ipv4_address: 10.89.1.13

  api:
    image: docker.io/makeplane/plane-backend:${APP_RELEASE:-v1.3.1}
    command: ./bin/docker-entrypoint-api.sh
    deploy:
      replicas: ${API_REPLICAS:-1}
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
    volumes:
      - logs_api:/code/plane/logs
    environment:
      <<: [ *app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env ]
    depends_on:
      - plane-db
      - plane-redis
      - plane-mq
    extra_hosts:
      - "plane-db:10.89.1.2"
      - "plane-redis:10.89.1.3"
      - "plane-mq:10.89.1.4"
      - "plane-minio:10.89.1.5"
    networks:
      atius:
        ipv4_address: 10.89.1.20

  worker:
    image: docker.io/makeplane/plane-backend:${APP_RELEASE:-v1.3.1}
    command: ./bin/docker-entrypoint-worker.sh
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
    volumes:
      - logs_worker:/code/plane/logs
    environment:
      <<: [ *app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env ]
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    extra_hosts:
      - "api:10.89.1.20"
      - "plane-db:10.89.1.2"
      - "plane-redis:10.89.1.3"
      - "plane-mq:10.89.1.4"
      - "plane-minio:10.89.1.5"
    networks:
      atius:
        ipv4_address: 10.89.1.21

  beat-worker:
    image: docker.io/makeplane/plane-backend:${APP_RELEASE:-v1.3.1}
    command: ./bin/docker-entrypoint-beat.sh
    deploy:
      replicas: ${BEAT_WORKER_REPLICAS:-1}
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.25"
    volumes:
      - logs_beat-worker:/code/plane/logs
    environment:
      <<: [ *app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env ]
    depends_on:
      - api
      - plane-db
      - plane-redis
      - plane-mq
    extra_hosts:
      - "api:10.89.1.20"
      - "plane-db:10.89.1.2"
      - "plane-redis:10.89.1.3"
      - "plane-mq:10.89.1.4"
      - "plane-minio:10.89.1.5"
    networks:
      atius:
        ipv4_address: 10.89.1.22

  migrator:
    image: docker.io/makeplane/plane-backend:${APP_RELEASE:-v1.3.1}
    command: ./bin/docker-entrypoint-migrator.sh
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.25"
    volumes:
      - logs_migrator:/code/plane/logs
    environment:
      <<: [ *app-env, *db-env, *redis-env, *minio-env, *aws-s3-env, *proxy-env ]
    depends_on:
      - plane-db
      - plane-redis
    extra_hosts:
      - "plane-db:10.89.1.2"
      - "plane-redis:10.89.1.3"
    networks:
      atius:
        ipv4_address: 10.89.1.23

  # Comment this if you already have a database running
  plane-db:
    image: postgres:15.7-alpine
    command: postgres -c 'max_connections=1000'
    ports:
      - "8747:5432"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "1.0"
    environment:
      <<: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      atius:
        ipv4_address: 10.89.1.2

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.25"
    volumes:
      - redisdata:/data
    networks:
      atius:
        ipv4_address: 10.89.1.3

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
    environment:
      <<: *mq-env
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      atius:
        ipv4_address: 10.89.1.4

  # Comment this if you using any external s3 compatible storage
  plane-minio:
    image: minio/minio:latest
    command: server /export --console-address ":9090"
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.5"
    environment:
      <<: *minio-env
    volumes:
      - uploads:/export
    networks:
      atius:
        ipv4_address: 10.89.1.5

  # Comment this if you already have a reverse proxy running
  proxy:
    image: docker.io/makeplane/plane-proxy:${APP_RELEASE:-v1.3.1}
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "0.25"
    environment:
      <<: *proxy-env
    ports:
      - "8090:80"
    volumes:
      - proxy_config:/config
      - proxy_data:/data
    depends_on:
      - web
      - api
      - space
      - admin
      - live
    extra_hosts:
      - "web:10.89.1.10"
      - "space:10.89.1.11"
      - "admin:10.89.1.12"
      - "live:10.89.1.13"
      - "api:10.89.1.20"
    networks:
      atius:
        ipv4_address: 10.89.1.30

volumes:
  pgdata:
  redisdata:
  uploads:
  logs_api:
  logs_worker:
  logs_beat-worker:
  logs_migrator:
  rabbitmq_data:
  proxy_config:
  proxy_data:

networks:
  atius:
    external: true
