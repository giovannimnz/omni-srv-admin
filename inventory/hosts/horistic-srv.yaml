      - "The deployment has an explicit toleration for the horistic-srv manual-only taint; generic K3s agents must not schedule on this node."
      - "Public OpenAI-compatible embeddings flow through https://router.atius.com.br/v1 with alias embedding-gte-v1."
  - id: tei-gte-reranker
    runtime: k3s
    namespace: ebeddings-local
    service: tei-gte-reranker
    model: Alibaba-NLP/gte-multilingual-reranker-base
    revision: 8215cf04918ba6f7b6a62bb44238ce2953d8831c
    dtype: float16
    listen: 10.21.1.21:31216
    public_alias: reranker-gte-multilingual-v1
    router_upstream: http://10.21.1.21:31216
    replicas_min: 2
    replicas_max: 4
    cpu_per_pod: 500m
    memory_request_per_pod: 2Gi
    memory_limit_per_pod: 3Gi
    managed_by: "omni-srv-admin"
    update_policy: "plan-first"
    last_audited: "2026-07-22"
    installed_on: "2026-07-22"
    notes:
      - "TEI 1.9.3 Candle serves the official FP16 GTE multilingual reranker through the private NodePort 31216; there is no direct public ingress."
      - "HPA keeps 2-4 replicas at 500m each; total reranker CPU allocation is 1000m-2000m."
      - "The public /v1/rerank contract is converted and governed inside router-ai-atius; the native TEI route remains /rerank with query/texts."
