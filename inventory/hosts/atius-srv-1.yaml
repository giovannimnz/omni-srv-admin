id: atius-srv-1
aliases:
  - srv1
  - atius
role: production
owner: giovanni
access:
  ssh: ubuntu@10.1.1.1
  public_ip: 137.131.190.161
  vpn_ip: 10.1.1.1
platform:
  provider: oracle-oci
  os: ubuntu-24.04
  arch: arm64
  desktop: lxde-xrdp
status: active
modules:
  - srv1-ops
  - xrdp-abnt2
  - fork-sync
  - domain-infrastructure
apps:
  - id: omni-srv-admin
    runtime: git-worktree
    install_type: source-git-release-managed
    install_path: /home/ubuntu/GitHub/omni-srv-admin
    current_version: "inventory-managed"
    desired_version: "matrix-managed"
    source: "https://github.com/giovannimnz/omni-srv-admin"
    managed_by: "omni-srv-admin"
    update_policy: "release-auto-update"
    scheduler: omni-fleet-agent.service
    version_matrix: modules/fleet-control-plane/configs/omni-version-matrix.json
    notes:
      - "Auto-update target governed by TbVersion + omni version matrix."
      - "Agent executor may stash local dirty work before switching back to main/release target."
  - id: jenkins
    runtime: podman
    image: localhost/jenkins:podman-latest
    unit: container-jenkins.service
    compose: ~/GitHub/containers/jenkins/podman-compose.yml
    public_url: https://jenkins.atius.com.br/
    healthcheck_url: http://127.0.0.1:8085/
    ports:
      - "8085:8080"
      - "50000:50000"
    volumes:
      - ~/GitHub/containers/jenkins/jenkins_home:/var/jenkins_home:rw
      - ~/GitHub/atius:/workspace/atius:ro
    cpus: 2
    network: srv1-podman
    install_type: podman-compose
    current_version: "2.541.3"
    desired_version: "2.541.3"
    source: "https://github.com/jenkinsci/jenkins"
    managed_by: "omni-srv-admin"
    update_policy: "plan-first"
    last_audited: "2026-06-15"
    notes:
      - "Phase 14-05: removed /var/run/docker.sock and /usr/bin/docker mounts (Docker uninstalled in cutover)"
      - "Use Podman-in-container or delegate to external Podman runners for DinD-equivalent jobs"
  - id: jenkins-agent
    runtime: k8s
    cluster: srv1-k3s
    namespace: jenkins
    image: localhost/jenkins:podman-latest
    manifest: modules/k3s-ha-portainer-oci/jenkins/agent-deployment.yaml
    jnlp_target: http://10.1.1.1:8085/  # via WireGuard wg0
    replicas: 2
    install_type: k8s-deployment
    current_version: "0.1.0"
    desired_version: "0.1.0"
    source: "https://github.com/jenkinsci/kubernetes-plugin"
    managed_by: "omni-srv-admin"
    update_policy: "plan-first"
    last_audited: "2026-06-15"
    depends_on: [jenkins]
    notes:
      - "Phase 14-06: Jenkins agent on K3s, replaces DinD with ephemeral build pods"
      - "Uses Kubernetes plugin + Pod templates per job type (maven, node, python)"
      - "JNLP over wg0 (10.1.1.1) — no public exposure"
  - id: cloudbeaver
    runtime: podman
    compose: ~/containers/cloudbeaver/podman-compose.yml
    public_url: https://cloudbeaver.atius.com.br/
    healthcheck_url: http://127.0.0.1:8978/
    ports:
      - "8978:8978"
    install_type: podman-compose
    current_version: "latest"
    desired_version: "latest"
    source: "https://github.com/dbeaver/cloudbeaver"
    managed_by: "omni-srv-admin"
    update_policy: "plan-first"
    last_audited: "2026-06-15"
    notes:
      - "Migrated to Podman during Docker→Podman cutover 2026-06-12; running on srv1-podman"
  - id: redis
    runtime: podman
    image: docker.io/library/redis:7-alpine
    install_type: podman-compose
    current_version: "7-alpine"
    desired_version: "7-alpine"
    managed_by: "omni-srv-admin"
    update_policy: "plan-first"
    last_audited: "2026-06-15"
    notes:
      - "Migrated to Podman during cutover; part of cloudbeaver pod (srv1-podman network)"
  - id: postgres
    runtime: podman
    image: docker.io/library/postgres:15-alpine
    install_type: podman-compose
    current_version: "15-alpine"
    desired_version: "15-alpine"
    managed_by: "omni-srv-admin"
    update_policy: "plan-first"
    last_audited: "2026-06-15"
    notes:
      - "Migrated to Podman during cutover; part of cloudbeaver pod (srv1-podman network)"
  - id: router-ai-atius
    runtime: podman
    canonical_product_id: router-ai-atius
    image: ghcr.io/giovannimnz/router-ai-atius:latest
    install_type: podman-compose
    current_version: "latest"
    desired_version: "latest"
    source: "https://github.com/giovannimnz/router-ai-atius"
    public_url: https://router.atius.com.br/
    healthcheck_url: http://127.0.0.1:3000/api/status
    listen:
      web_api: 0.0.0.0:3000
      docs_target: 127.0.0.1:3003
    docs_status:
      last_audited: "2026-07-05"
      public_url: https://router.atius.com.br/docs/
      status: degraded
      finding: "Apache points docs to 127.0.0.1:3003, but no listener was present; public route returned 503."
    managed_by: "omni-srv-admin"
    update_policy: "plan-first"
    last_audited: "2026-07-05"
    notes:
      - "Atius AI Router on SRV-1; published via Cloudflare + Apache"
      - "2026-07-05: root and /api/status returned 200 through public router.atius.com.br and local 127.0.0.1:3000."
  - id: rclone-gdrive-mount
    runtime: systemd-user
    unit: rclone-gdrive-mount.service
    install_type: systemd-user-service
    managed_by: "omni-srv-admin"
    update_policy: "plan-first"
    last_audited: "2026-06-15"
    notes:
      - "OAuth giovannimunizds@gmail.com; mount ~/GDrive/ RW; 5TB quota"
  - id: rust-toolchain
    runtime: local-rustup
    install_type: rustup-managed
    install_path: /home/ubuntu/.cargo/bin
    rustup_home: /home/ubuntu/.rustup
    cargo_home: /home/ubuntu/.cargo
    current_version: "1.96.0"
    desired_version: "1.96.0"
    toolchain: stable
    profile: minimal
    arch: aarch64-unknown-linux-gnu
    source: "https://sh.rustup.rs"
    update_command: "rustup update stable"
    version_command: "rustc --version"
    managed_by: "omni-srv-admin"
    update_policy: "sim-fleet-update"
    last_audited: "2026-06-16"
    installed_on: "2026-06-16"
    bashrc_path_line: '. "$HOME/.cargo/env"'
    notes:
      - "Instalado em 2026-06-16 via rustup non-interactive (-y --default-toolchain stable --profile minimal --no-modify-path)"
      - "cargo-binstall 1.20.0 instalado em ~/.cargo/bin/cargo-binstall (binário pré-compilado do release v1.20.0; o install.sh raw/main retorna 404)"
      - "Update fleet: ~/GitHub/omni-srv-admin/modules/rust-zellij-fleet/scripts/update-fleet.sh"
  - id: cargo-binstall
    runtime: local-binary
    install_type: manual-release-binary
    install_path: /home/ubuntu/.cargo/bin/cargo-binstall
    current_version: "1.20.0"
    desired_version: "1.20.0"
    source: "https://github.com/cargo-bins/cargo-binstall/releases"
    version_command: "cargo-binstall -V"
    managed_by: "omni-srv-admin"
    update_policy: "manual"
    last_audited: "2026-06-16"
    installed_on: "2026-06-16"
    notes:
      - "Subcomando cargo-binstall permite `cargo binstall <crate>` para instalar Rust crates pré-compiladas"
      - "Download via tarball do release (não do install.sh que retornou 404 em 2026-06-16)"
  - id: zellij
    runtime: local-rustup-binary
    install_type: cargo-binstall
    install_path: /home/ubuntu/.cargo/bin/zellij
    current_version: "0.44.3"
    desired_version: "0.44.3"
    source: "https://github.com/zellij-org/zellij"
    binary_target: aarch64-unknown-linux-musl
    update_command: "cargo binstall zellij --no-confirm"
    version_command: "zellij --version"
    managed_by: "omni-srv-admin"
    update_policy: "sim-fleet-update"
    last_audited: "2026-06-16"
    installed_on: "2026-06-16"
    notes:
      - "Terminal multiplexer; instalado em 2026-06-16 via cargo binstall (binário pré-compilado, 2-3s por host)"
      - "Sem fallback `cargo install` necessário — binário direto do GitHub release funcionou de primeira nos 3 servers"
      - "Update fleet: ~/GitHub/omni-srv-admin/modules/rust-zellij-fleet/scripts/update-fleet.sh"
forks:
  - id: router-ai-atius
    canonical_product_id: router-ai-atius
    sync_project: atius-router
    runtime_app_id: router-ai-atius
    local_path: /home/ubuntu/GitHub/containers/router-ai-atius
    upstream: https://github.com/QuantumNous/new-api
    sync_manifest: modules/fork-sync/projects/atius-router/sync.yaml
    state: deployed-runtime
    components:
      - id: atius-router-docs
        local_path: /home/ubuntu/GitHub/containers/router-ai-atius/docs/atius-router-docs
        upstream: https://github.com/giovannimnz/new-api-docs-v1
        sync_manifest: modules/fork-sync/projects/atius-router-docs/sync.yaml
        state: degraded-edge-target
        note: "2026-07-05: path is canonical under /home/ubuntu/GitHub/containers/router-ai-atius; edge /docs is 503 until local docs service/target is restored."
  - id: notebooklm-py
    local_path: /home/ubuntu/GitHub/forks/notebooklm-py
    upstream: https://github.com/teng-lin/notebooklm-py.git
    sync_manifest: modules/fork-sync/projects/notebooklm-py/sync.yaml
    state: worktree-only
  - id: aionui
    local_path: /home/ubuntu/GitHub/forks/AionUi
    upstream: https://github.com/iOfficeAI/AionUi
    sync_manifest: modules/fork-sync/projects/aionui/sync.yaml
    state: worktree-only-paused
  - id: horus-spec-driven
    local_path: /home/ubuntu/GitHub/SDD/horus-spec-driven
    upstream: https://github.com/open-gsd/gsd-core
    sync_manifest: modules/fork-sync/projects/horus-spec-driven/sync.yaml
    state: source-installed-global-runtime
database:
  target: DbOmniFleet
  endpoint: 10.11.1.11:6432
  transport: PgBouncer
  configured: true
  note: "SRV-1 reescreve PGHOST para 127.0.0.1 localmente porque o PgBouncer também está em loopback."
logs:
  local_dir: /home/ubuntu/.logs
  retention_days: 15
backup:
  gdrive_base: ATIUS-SRV/SRV-1/Backup
  map: modules/srv1-ops/configs/backup-map.yaml
resource_governor:
  config: modules/srv1-ops/configs/resource-governor.env
  log_dir: /home/ubuntu/.logs/resource-governor
  profiles:
    - builds
    - interactive
    - transfers
notes:
  vault_project: 20-PROJETOS/21-PROJETOS-ATIVOS/omni-srv-admin
  codex_runtime_standard: "2026-07-04: ~/.codex active TOML service_tier values verified/enforced as normal (Padrão), including base config, profiles and GSD agents."
  desktop_standard: "2026-07-02: ubuntu-arm64-xrdp-desktop-standard is mandatory here; xrdp-abnt2 and dark-theme-ubuntu validated live."
  knowledge_authority: "Obsidian and GBrain authoritative writes stay on atius-srv-1 only."
oci:
  last_snapshot_id: "pending-250f32ed-819e-4ccf-9b70-a08aa298a94c"
