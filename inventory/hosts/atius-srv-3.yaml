apps:
  - id: omni-srv-admin
    runtime: git-worktree
    install_type: source-git-release-managed
    install_path: /home/ubuntu/GitHub/omni-srv-admin
    current_version: "inventory-managed"
    desired_version: "matrix-managed"
    source: "https://github.com/giovannimnz/omni-srv-admin"
    managed_by: "omni-srv-admin"
    update_policy: "release-auto-update"
    scheduler: omni-fleet-agent.service
    version_matrix: modules/fleet-control-plane/configs/omni-version-matrix.json
    notes:
      - "Auto-update target governed by TbVersion + omni version matrix."
      - "Agent executor may stash local dirty work before switching back to main/release target."
  - id: wayland
    runtime: systemd
    unit: wayland.service
    install_type: source-standalone-managed-runtime
    install_path: /home/ubuntu/GitHub/wayland/dist-server/server.mjs
    source_repo_path: /home/ubuntu/GitHub/wayland
    current_version: "0.11.9"
    desired_version: "0.11.9"
    source: "https://github.com/FerroxLabs/wayland"
    public_url: https://wayland.atius.com.br/
    healthcheck_url: http://127.0.0.1:25808/api/auth/status
    managed_by: "omni-srv-admin"
    update_policy: "source-rebuild-postinstall"
    customization_entrypoint: /home/ubuntu/GitHub/omni-srv-admin/modules/fleet/scripts/wayland-srv3-update.sh
    last_audited: "2026-07-03"
    notes:
      - "WebUI login defaults to pt-BR when no saved language exists."
      - "Conversar na pasta defaults to /home/ubuntu/GitHub."
      - "Source patch stays in ~/GitHub/wayland; runtime rebuild/reapply ownership stays in omni-srv-admin."
  - id: rust-toolchain
    runtime: local-rustup
    install_type: rustup-managed
    install_path: /home/ubuntu/.cargo/bin
    rustup_home: /home/ubuntu/.rustup
    cargo_home: /home/ubuntu/.cargo
    current_version: "1.96.0"
    desired_version: "1.96.0"
    toolchain: stable
    profile: minimal
    arch: aarch64-unknown-linux-gnu
    source: "https://sh.rustup.rs"
    update_command: "rustup update stable"
    version_command: "rustc --version"
    managed_by: "omni-srv-admin"
    update_policy: "sim-fleet-update"
    last_audited: "2026-06-16"
    installed_on: "2026-06-16"
    bashrc_path_line: '. "$HOME/.cargo/env"'
    notes:
      - "Instalado em 2026-06-16 via rustup non-interactive (SSH 10.1.1.7)"
      - "Update fleet: ~/GitHub/omni-srv-admin/modules/rust-zellij-fleet/scripts/update-fleet.sh"
  - id: cargo-binstall
    runtime: local-binary
    install_type: manual-release-binary
    install_path: /home/ubuntu/.cargo/bin/cargo-binstall
    current_version: "1.20.0"
    desired_version: "1.20.0"
    source: "https://github.com/cargo-bins/cargo-binstall/releases"
    version_command: "cargo-binstall -V"
    managed_by: "omni-srv-admin"
    update_policy: "manual"
    last_audited: "2026-06-16"
    installed_on: "2026-06-16"
  - id: zellij
    runtime: local-rustup-binary
    install_type: cargo-binstall
    install_path: /home/ubuntu/.cargo/bin/zellij
    current_version: "0.44.3"
    desired_version: "0.44.3"
    source: "https://github.com/zellij-org/zellij"
    binary_target: aarch64-unknown-linux-musl
    update_command: "cargo binstall zellij --no-confirm"
    version_command: "zellij --version"
    managed_by: "omni-srv-admin"
    update_policy: "sim-fleet-update"
    last_audited: "2026-06-16"
    installed_on: "2026-06-16"
  - id: pm2-ubuntu
    runtime: systemd
    unit: pm2-ubuntu.service
    install_type: npm-global-plus-systemd
    install_path: /usr/local/bin/pm2
    current_version: "7.0.1"
    desired_state: active-enabled
    managed_by: "omni-srv-admin"
    update_policy: "plan-first"
    last_audited: "2026-06-25"
    installed_on: "2026-06-25"
    notes:
      - "Phase 29 runtime repair: installed PM2 globally and created oneshot systemd unit with PM2_HOME=/home/ubuntu/.pm2."
  - id: mt5-fex-podman
    runtime: podman
    install_type: podman-container
    container_name: mt5-fex
    image: localhost/mt5-fex:v0.9-mvp
    source: /home/ubuntu/GitHub/mt5-fex-podman
    public_url: https://remote.atius.com.br/mt5/1/
    healthcheck_url: http://10.1.1.3:6081/vnc.html
    ports:
      - "10.1.1.3:6081:6081"
      - "127.0.0.1:8066:8066"
    network: srv3-podman-v2
    components:
      - x11vnc
      - novnc
      - websockify
      - xvfb
      - fex
      - wine-10
    current_version: "v0.9-mvp"
    desired_version: "v0.9-mvp"
    managed_by: "omni-srv-admin"
    update_policy: "plan-first"
    last_audited: "2026-06-26"
    installed_on: "2026-06-26"
    notes:
      - "Runtime criado por /home/ubuntu/GitHub/mt5-fex-podman/install.sh com podman run direto."
      - "noVNC interno/VPN em http://10.1.1.3:6081/; URL publica em https://remote.atius.com.br/mt5/1/."
      - "Apache/Cloudflare ficam no atius-srv-1; VNC puro fica privado no container."
      - "Autenticacao publica de /mt5/<id> deve passar pelo gate SSO do SRV-1 (modules/mt5-remote-auth), usando auth-token + /v1/auth/me; nao criar novos Basic Auth por rota."
