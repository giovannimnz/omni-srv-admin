owner: giovanni
access:
  ssh: ubuntu@10.1.1.3
  public_ip: 136.248.126.12
  vpn_ip: 10.1.1.3
  legacy_vpn_ip: 10.1.1.7
platform:
  provider: oracle-oci
  os: ubuntu-24.04
  arch: arm64
  desktop: lxde-xrdp
