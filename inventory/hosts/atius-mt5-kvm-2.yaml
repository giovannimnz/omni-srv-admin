id: atius-mt5-kvm-2
aliases:
  - mt5-kvm-2
  - kvm-2
role: mt5-execution-backup
owner: giovanni
access:
  ssh: ubuntu@10.1.1.17
  public_ip: 147.15.83.218
  vpn_ip: 10.1.1.17
platform:
  provider: oracle-oci-kvm
  os: ubuntu-24.04
  arch: amd64
  kernel: 6.17.0-1016-oracle
status: active
modules:
  - fleet
  - rust-zellij-fleet
constraints:
  - no-k3s-member-currently
  - mt5-execution-vm
  - preserve-slave-ea-listener-9002
network:
  vpn_hub: atius-srv-2
