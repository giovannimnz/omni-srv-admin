source: 10.11.1.11:/home/ubuntu/GitHub
mount_path: /home/ubuntu/Servers/atius-srv-1/GitHub
display_label: ATIUS-SRV-1 GitHub
access: read-write
identity:
  uid: 1001
  gid: 1001
export:
