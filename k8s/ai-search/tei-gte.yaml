---
apiVersion: v1
kind: Namespace
metadata:
  name: ai-search
  labels:
    app.kubernetes.io/part-of: local-ai-embeddings
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tei-gte-cache
  namespace: ai-search
  labels:
    app.kubernetes.io/name: tei-gte
    app.kubernetes.io/component: embeddings-backend
    app.kubernetes.io/part-of: local-ai-embeddings
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-gte
  namespace: ai-search
  labels:
    app.kubernetes.io/name: tei-gte
    app.kubernetes.io/component: embeddings-backend
    app.kubernetes.io/part-of: local-ai-embeddings
  annotations:
    embeddings.atius.com.br/public-alias: embedding-gte-v1
    embeddings.atius.com.br/model-id: Alibaba-NLP/gte-multilingual-base
    embeddings.atius.com.br/served-model-name: embedding-gte-v1
    embeddings.atius.com.br/dimensions: "768"
    embeddings.atius.com.br/revision: main
    embeddings.atius.com.br/revision-note: pin-to-huggingface-commit-after-first-live-validation
    embeddings.atius.com.br/cpu-request: 500m
    embeddings.atius.com.br/cpu-limit: 1000m
    embeddings.atius.com.br/memory-request: 6Gi
    embeddings.atius.com.br/memory-limit: 12Gi
    embeddings.atius.com.br/tokenization-workers: "1"
    embeddings.atius.com.br/max-client-batch-size: "4"
    embeddings.atius.com.br/autoscaling: disabled
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tei-gte
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tei-gte
        app.kubernetes.io/component: embeddings-backend
        app.kubernetes.io/part-of: local-ai-embeddings
    spec:
      nodeSelector:
        kubernetes.io/hostname: horistic-srv
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 8.8.8.8
        searches:
          - ai-search.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "1"
      terminationGracePeriodSeconds: 30
      containers:
        - name: text-embeddings-inference
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest
          imagePullPolicy: IfNotPresent
          args:
            - --model-id
            - Alibaba-NLP/gte-multilingual-base
            - --revision
            - main
            - --tokenization-workers
            - "1"
            - --served-model-name
            - embedding-gte-v1
            - --hostname
            - 10.1.1.4
            - --port
            - "3115"
            - --dtype
            - float32
            - --pooling
            - cls
            - --huggingface-hub-cache
            - /data
            - --max-client-batch-size
            - "4"
            - --payload-limit
            - "2000000"
          env:
            - name: MODEL_ID
              value: Alibaba-NLP/gte-multilingual-base
            - name: SERVED_MODEL_NAME
              value: embedding-gte-v1
            - name: HUGGINGFACE_HUB_CACHE
              value: /data
          ports:
            - name: http
              containerPort: 3115
            - name: metrics
              containerPort: 9000
          resources:
            requests:
              cpu: 500m
              memory: 6Gi
            limits:
              cpu: 1000m
              memory: 12Gi
          volumeMounts:
            - name: model-cache
              mountPath: /data
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 6
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: tei-gte-cache
---
apiVersion: v1
kind: Service
metadata:
  name: tei-gte
  namespace: ai-search
  labels:
    app.kubernetes.io/name: tei-gte
    app.kubernetes.io/component: embeddings-backend
    app.kubernetes.io/part-of: local-ai-embeddings
  annotations:
    embeddings.atius.com.br/internal-base-url: http://10.1.1.4:3115
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tei-gte
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9000
      targetPort: metrics
