---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-qwen-fp16
  namespace: embeddings-bench
  labels:
    app.kubernetes.io/name: tei-qwen-fp16
    app.kubernetes.io/component: embeddings-canary
    app.kubernetes.io/part-of: local-ai-embeddings
  annotations:
    embeddings.atius.com.br/model-id: Qwen/Qwen3-Embedding-0.6B
    embeddings.atius.com.br/revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
    embeddings.atius.com.br/served-model-name: qwen3-embedding-0.6b-tei-fp16
    embeddings.atius.com.br/dimensions: "32-1024-mrl"
    embeddings.atius.com.br/quantization: fp16
    embeddings.atius.com.br/max-batch-tokens: "1024"
    embeddings.atius.com.br/benchmark-only: "true"
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tei-qwen-fp16
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tei-qwen-fp16
        app.kubernetes.io/component: embeddings-canary
        app.kubernetes.io/part-of: local-ai-embeddings
    spec:
      nodeSelector:
        kubernetes.io/hostname: horistic-srv
      tolerations:
        - key: atius.com/manual-only
          operator: Equal
          value: "true"
          effect: NoSchedule
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        nameservers: [1.1.1.1, 8.8.8.8]
        options:
          - name: ndots
            value: "1"
      terminationGracePeriodSeconds: 30
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest@sha256:16c0a827cf79d5dc9b9ec1b0b5df7ffd165726f9bdf1daa9d4f7a355dd842f7e
          imagePullPolicy: IfNotPresent
          args:
            - --model-id
            - Qwen/Qwen3-Embedding-0.6B
            - --revision
            - 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
            - --served-model-name
            - qwen3-embedding-0.6b-tei-fp16
            - --dtype
            - float16
            - --pooling
            - last-token
            - --tokenization-workers
            - "1"
            - --max-concurrent-requests
            - "4"
            - --max-batch-tokens
            - "1024"
            - --max-client-batch-size
            - "4"
            - --hostname
            - 10.21.1.21
            - --port
            - "3222"
            - --prometheus-port
            - "9222"
            - --huggingface-hub-cache
            - /cache/huggingface
          env:
            - name: OMP_NUM_THREADS
              value: "1"
            - name: RAYON_NUM_THREADS
              value: "1"
          ports:
            - name: http
              containerPort: 3222
            - name: metrics
              containerPort: 9222
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: 500m
              memory: 8Gi
          startupProbe:
            httpGet:
              host: 10.21.1.21
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              host: 10.21.1.21
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: model-cache
              mountPath: /cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: embeddings-bench-cache
---
apiVersion: v1
kind: Service
metadata:
  name: tei-qwen-fp16
  namespace: embeddings-bench
  annotations:
    embeddings.atius.com.br/internal-base-url: http://10.21.1.21:3222
    embeddings.atius.com.br/benchmark-only: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tei-qwen-fp16
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9222
      targetPort: metrics
