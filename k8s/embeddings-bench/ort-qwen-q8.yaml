---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ort-qwen-q8-server
  namespace: embeddings-bench
  labels:
    app.kubernetes.io/name: ort-qwen-q8
    app.kubernetes.io/component: embeddings-canary
data:
  server.py: |
    import json
    import math
    import os
    import threading
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    import numpy as np
    import onnxruntime as ort
    from tokenizers import Tokenizer

    MODEL_DIR = os.environ.get("MODEL_DIR", "/cache/qwen-onnx-q8")
    MODEL_NAME = os.environ.get("MODEL_NAME", "qwen3-embedding-0.6b-ort-q8")
    HOST = os.environ.get("SERVER_HOST", "10.21.1.21")
    PORT = int(os.environ.get("SERVER_PORT", "3220"))
    MAX_TOKENS = int(os.environ.get("MAX_TOKENS", "8192"))
    MAX_BATCH = int(os.environ.get("MAX_BATCH", "4"))

    tokenizer = Tokenizer.from_file(os.path.join(MODEL_DIR, "tokenizer.json"))
    pad_token = "<|endoftext|>"
    pad_id = tokenizer.token_to_id(pad_token)
    if pad_id is None:
        raise RuntimeError(f"tokenizer does not define {pad_token}")
    tokenizer.enable_truncation(max_length=MAX_TOKENS, direction="right")
    tokenizer.enable_padding(direction="left", pad_id=pad_id, pad_token=pad_token)

    options = ort.SessionOptions()
    options.intra_op_num_threads = 1
    options.inter_op_num_threads = 1
    options.execution_mode = ort.ExecutionMode.ORT_SEQUENTIAL
    options.graph_optimization_level = ort.GraphOptimizationLevel.ORT_ENABLE_ALL
    session = ort.InferenceSession(
        os.path.join(MODEL_DIR, "onnx", "model_quantized.onnx"),
        sess_options=options,
        providers=["CPUExecutionProvider"],
    )
    session_lock = threading.Lock()
    input_names = {item.name for item in session.get_inputs()}
    print(
        json.dumps(
            {
                "event": "model_loaded",
                "inputs": sorted(input_names),
                "input_schema": [
                    {"name": item.name, "type": item.type, "shape": item.shape}
                    for item in session.get_inputs()
                ],
                "outputs": [item.name for item in session.get_outputs()],
                "providers": session.get_providers(),
            }
        ),
        flush=True,
    )


    def embed(texts):
        encoded = tokenizer.encode_batch(texts, add_special_tokens=True)
        input_ids = np.asarray([item.ids for item in encoded], dtype=np.int64)
        attention_mask = np.asarray(
            [item.attention_mask for item in encoded], dtype=np.int64
        )
        feeds = {}
        if "input_ids" in input_names:
            feeds["input_ids"] = input_ids
        if "attention_mask" in input_names:
            feeds["attention_mask"] = attention_mask
        if "position_ids" in input_names:
            # Match Qwen3Model.forward when callers omit position_ids: positions
            # are absolute across the padded sequence, not reset after left pads.
            position_ids = np.broadcast_to(
                np.arange(input_ids.shape[1], dtype=np.int64), input_ids.shape
            ).copy()
            feeds["position_ids"] = position_ids
        empty_past = np.empty((len(encoded), 8, 0, 128), dtype=np.float32)
        for input_name in input_names:
            if input_name.startswith("past_key_values."):
                feeds[input_name] = empty_past
        missing = input_names.difference(feeds)
        if missing:
            raise RuntimeError(f"unsupported ONNX inputs: {sorted(missing)}")
        with session_lock:
            hidden = session.run(["last_hidden_state"], feeds)[0]
        pooled = []
        for batch_index, mask in enumerate(attention_mask):
            token_indexes = np.flatnonzero(mask)
            vector = hidden[batch_index, int(token_indexes[-1])].astype(np.float32)
            norm = float(np.linalg.norm(vector))
            if not math.isfinite(norm) or norm == 0.0:
                raise RuntimeError("invalid embedding norm")
            pooled.append((vector / norm).tolist())
        return pooled, int(attention_mask.sum())


    class Handler(BaseHTTPRequestHandler):
        server_version = "atius-ort-embeddings/1"

        def log_message(self, format_string, *args):
            print(format_string % args, flush=True)

        def send_json(self, status, payload):
            body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
            self.send_response(status)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def do_GET(self):
            if self.path == "/health":
                self.send_json(200, {"status": "ok"})
            elif self.path == "/v1/models":
                self.send_json(
                    200,
                    {
                        "object": "list",
                        "data": [{"id": MODEL_NAME, "object": "model", "owned_by": "atius"}],
                    },
                )
            else:
                self.send_json(404, {"error": "not found"})

        def do_POST(self):
            if self.path != "/v1/embeddings":
                self.send_json(404, {"error": "not found"})
                return
            try:
                length = int(self.headers.get("Content-Length", "0"))
                payload = json.loads(self.rfile.read(length))
                values = payload.get("input")
                if isinstance(values, str):
                    values = [values]
                if not isinstance(values, list) or not values:
                    raise ValueError("input must be a non-empty string or list")
                if len(values) > MAX_BATCH or not all(isinstance(item, str) for item in values):
                    raise ValueError(f"input batch must contain 1..{MAX_BATCH} strings")
                vectors, tokens = embed(values)
                self.send_json(
                    200,
                    {
                        "object": "list",
                        "model": MODEL_NAME,
                        "data": [
                            {"object": "embedding", "index": index, "embedding": vector}
                            for index, vector in enumerate(vectors)
                        ],
                        "usage": {"prompt_tokens": tokens, "total_tokens": tokens},
                    },
                )
            except Exception as exc:
                self.send_json(400, {"error": {"message": str(exc)}})


    ThreadingHTTPServer((HOST, PORT), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ort-qwen-q8
  namespace: embeddings-bench
  labels:
    app.kubernetes.io/name: ort-qwen-q8
    app.kubernetes.io/component: embeddings-canary
    app.kubernetes.io/part-of: local-ai-embeddings
  annotations:
    embeddings.atius.com.br/model-id: onnx-community/Qwen3-Embedding-0.6B-ONNX
    embeddings.atius.com.br/revision: c25a394dd583836952667c12f008335071b3f43d
    embeddings.atius.com.br/served-model-name: qwen3-embedding-0.6b-ort-q8
    embeddings.atius.com.br/dimensions: "1024"
    embeddings.atius.com.br/quantization: q8-uint8
    embeddings.atius.com.br/benchmark-only: "true"
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ort-qwen-q8
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ort-qwen-q8
        app.kubernetes.io/component: embeddings-canary
        app.kubernetes.io/part-of: local-ai-embeddings
    spec:
      nodeSelector:
        kubernetes.io/hostname: horistic-srv
      tolerations:
        - key: atius.com/manual-only
          operator: Equal
          value: "true"
          effect: NoSchedule
      hostNetwork: true
      dnsPolicy: None
      dnsConfig:
        nameservers: [1.1.1.1, 8.8.8.8]
        options:
          - name: ndots
            value: "1"
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: fetch-model
          image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              MODEL_DIR=/cache/qwen-onnx-q8
              REVISION=c25a394dd583836952667c12f008335071b3f43d
              BASE_URL="https://huggingface.co/onnx-community/Qwen3-Embedding-0.6B-ONNX/resolve/${REVISION}"
              MODEL_SHA256=87cd124e0ef1fd1f223ebc283efccbaeac386d0b08344701c46975d0657b591f
              mkdir -p "${MODEL_DIR}/onnx"
              MODEL_PATH="${MODEL_DIR}/onnx/model_quantized.onnx"
              if ! ([ -f "${MODEL_PATH}" ] && echo "${MODEL_SHA256}  ${MODEL_PATH}" | sha256sum -c -); then
                curl --fail --location --retry 4 --output "${MODEL_PATH}.partial" "${BASE_URL}/onnx/model_quantized.onnx?download=true"
                echo "${MODEL_SHA256}  ${MODEL_PATH}.partial" | sha256sum -c -
                mv "${MODEL_PATH}.partial" "${MODEL_PATH}"
              fi
              for FILE_PATH in added_tokens.json config.json merges.txt special_tokens_map.json tokenizer.json tokenizer_config.json vocab.json; do
                if [ ! -s "${MODEL_DIR}/${FILE_PATH}" ]; then
                  curl --fail --location --retry 4 --output "${MODEL_DIR}/${FILE_PATH}.partial" "${BASE_URL}/${FILE_PATH}?download=true"
                  mv "${MODEL_DIR}/${FILE_PATH}.partial" "${MODEL_DIR}/${FILE_PATH}"
                fi
              done
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: model-cache
              mountPath: /cache
        - name: install-runtime
          image: docker.io/library/python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              PYDEPS=/cache/ort-runtime/pydeps
              MARKER="${PYDEPS}/.atius-ort-1.27.0"
              if [ -f "${MARKER}" ]; then
                exit 0
              fi
              mkdir -p "${PYDEPS}"
              python -m pip install --disable-pip-version-check --no-cache-dir --upgrade \
                --target "${PYDEPS}" \
                onnxruntime==1.27.0 tokenizers==0.23.1 numpy==2.5.1
              touch "${MARKER}"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: model-cache
              mountPath: /cache
      containers:
        - name: ort-server
          image: docker.io/library/python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
          imagePullPolicy: IfNotPresent
          command: [python, /opt/atius/server.py]
          env:
            - name: PYTHONPATH
              value: /cache/ort-runtime/pydeps
            - name: MODEL_DIR
              value: /cache/qwen-onnx-q8
            - name: MODEL_NAME
              value: qwen3-embedding-0.6b-ort-q8
            - name: SERVER_HOST
              value: 10.21.1.21
            - name: SERVER_PORT
              value: "3220"
            - name: MAX_TOKENS
              value: "8192"
            - name: MAX_BATCH
              value: "4"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: OPENBLAS_NUM_THREADS
              value: "1"
          ports:
            - name: http
              containerPort: 3220
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 500m
              memory: 4Gi
          startupProbe:
            httpGet:
              host: 10.21.1.21
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              host: 10.21.1.21
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: model-cache
              mountPath: /cache
            - name: server-code
              mountPath: /opt/atius
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: embeddings-bench-cache
        - name: server-code
          configMap:
            name: ort-qwen-q8-server
---
apiVersion: v1
kind: Service
metadata:
  name: ort-qwen-q8
  namespace: embeddings-bench
  annotations:
    embeddings.atius.com.br/internal-base-url: http://10.21.1.21:3220
    embeddings.atius.com.br/benchmark-only: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ort-qwen-q8
  ports:
    - name: http
      port: 80
      targetPort: http
