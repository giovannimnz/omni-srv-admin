---
apiVersion: v1
kind: Namespace
metadata:
  name: embeddings-bench
  labels:
    app.kubernetes.io/part-of: local-ai-embeddings
    atius.com/environment: benchmark
---
apiVersion: v1
kind: LimitRange
metadata:
  name: pod-500m-strict
  namespace: embeddings-bench
  labels:
    managed-by: omni-srv-admin
    atius.com/cpu-unit: pod-500m
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
      defaultRequest:
        cpu: 500m
    - type: Pod
      max:
        cpu: 500m
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: one-canary-at-a-time
  namespace: embeddings-bench
  labels:
    managed-by: omni-srv-admin
spec:
  hard:
    pods: "1"
    requests.cpu: 500m
    limits.cpu: 500m
    requests.memory: 6Gi
    limits.memory: 8Gi
    persistentvolumeclaims: "1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: embeddings-bench-cache
  namespace: embeddings-bench
  labels:
    app.kubernetes.io/name: embeddings-bench
    app.kubernetes.io/component: model-cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
