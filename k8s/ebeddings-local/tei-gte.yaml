---
apiVersion: v1
kind: Namespace
metadata:
  name: ebeddings-local
  labels:
    app.kubernetes.io/part-of: local-ai-embeddings
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-20-defaults
  namespace: ebeddings-local
  labels:
    managed-by: omni-srv-admin
    atius.com/cpu-unit: pod-500m
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
      defaultRequest:
        cpu: 500m
    - type: Pod
      max:
        cpu: 500m
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tei-gte-cache
  namespace: ebeddings-local
  labels:
    app.kubernetes.io/name: tei-gte
    app.kubernetes.io/component: embeddings-backend
    app.kubernetes.io/part-of: local-ai-embeddings
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-gte
  namespace: ebeddings-local
  labels:
    app.kubernetes.io/name: tei-gte
    app.kubernetes.io/component: embeddings-backend
    app.kubernetes.io/part-of: local-ai-embeddings
  annotations:
    embeddings.atius.com.br/public-alias: embedding-gte-v1
    embeddings.atius.com.br/model-id: Alibaba-NLP/gte-multilingual-base
    embeddings.atius.com.br/served-model-name: embedding-gte-v1
    embeddings.atius.com.br/dimensions: "768"
    embeddings.atius.com.br/revision: 9bbca17d9273fd0d03d5725c7a4b0f6b45142062
    embeddings.atius.com.br/revision-note: pinned-after-ha-validation-2026-08-21
    embeddings.atius.com.br/cpu-request: 500m
    embeddings.atius.com.br/cpu-limit: 500m
    embeddings.atius.com.br/memory-request: 2Gi
    embeddings.atius.com.br/memory-limit: 8Gi
    embeddings.atius.com.br/tokenization-workers: "1"
    embeddings.atius.com.br/max-client-batch-size: "4"
    embeddings.atius.com.br/autoscaling: fixed-2-ha
    embeddings.atius.com.br/image-digest: 16c0a827cf79d5dc9b9ec1b0b5df7ffd165726f9bdf1daa9d4f7a355dd842f7e
    embeddings.atius.com.br/node-port: "31115"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  minReadySeconds: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: tei-gte
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tei-gte
        app.kubernetes.io/component: embeddings-backend
        app.kubernetes.io/part-of: local-ai-embeddings
    spec:
      nodeSelector:
        kubernetes.io/hostname: horistic-srv
      tolerations:
        - key: atius.com/manual-only
          operator: Equal
          value: "true"
          effect: NoSchedule
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 8.8.8.8
        searches:
          - ebeddings-local.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "1"
      terminationGracePeriodSeconds: 30
      containers:
        - name: text-embeddings-inference
          image: ghcr.io/huggingface/text-embeddings-inference@sha256:16c0a827cf79d5dc9b9ec1b0b5df7ffd165726f9bdf1daa9d4f7a355dd842f7e
          imagePullPolicy: IfNotPresent
          args:
            - --model-id
            - Alibaba-NLP/gte-multilingual-base
            - --revision
            - 9bbca17d9273fd0d03d5725c7a4b0f6b45142062
            - --tokenization-workers
            - "1"
            - --served-model-name
            - embedding-gte-v1
            - --hostname
            - 0.0.0.0
            - --port
            - "3000"
            - --dtype
            - float32
            - --pooling
            - cls
            - --huggingface-hub-cache
            - /data
            - --max-client-batch-size
            - "4"
            - --payload-limit
            - "2000000"
          env:
            - name: MODEL_ID
              value: Alibaba-NLP/gte-multilingual-base
            - name: SERVED_MODEL_NAME
              value: embedding-gte-v1
            - name: HUGGINGFACE_HUB_CACHE
              value: /data
          ports:
            - name: http
              containerPort: 3000
            - name: metrics
              containerPort: 9000
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 500m
              memory: 8Gi
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          volumeMounts:
            - name: model-cache
              mountPath: /data
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 6
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: tei-gte-cache
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tei-gte
  namespace: ebeddings-local
  labels:
    app.kubernetes.io/name: tei-gte
    app.kubernetes.io/component: embeddings-backend
    app.kubernetes.io/part-of: local-ai-embeddings
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tei-gte
---
apiVersion: v1
kind: Service
metadata:
  name: tei-gte
  namespace: ebeddings-local
  labels:
    app.kubernetes.io/name: tei-gte
    app.kubernetes.io/component: embeddings-backend
    app.kubernetes.io/part-of: local-ai-embeddings
  annotations:
    embeddings.atius.com.br/internal-base-url: http://10.21.1.21:31115
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: tei-gte
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31115
