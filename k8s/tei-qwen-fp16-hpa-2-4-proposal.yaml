---
apiVersion: v1
kind: Namespace
metadata:
  name: embeddings-qwen
  labels:
    app.kubernetes.io/part-of: local-ai-embeddings
    atius.com/environment: proposal
  annotations:
    atius.com/apply-policy: explicit-capacity-and-policy-approval-required
---
apiVersion: v1
kind: LimitRange
metadata:
  name: qwen-pod-resources
  namespace: embeddings-qwen
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 500m
        memory: 3Gi
      default:
        cpu: 500m
        memory: 5Gi
    - type: Pod
      max:
        cpu: 500m
        memory: 5Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: qwen-hpa-ceiling
  namespace: embeddings-qwen
spec:
  hard:
    pods: "4"
    requests.cpu: 2000m
    limits.cpu: 2000m
    requests.memory: 12Gi
    limits.memory: 20Gi
    persistentvolumeclaims: "1"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qwen-huggingface-cache
  namespace: embeddings-qwen
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-qwen-fp16
  namespace: embeddings-qwen
  labels:
    app.kubernetes.io/name: tei-qwen-fp16
    app.kubernetes.io/component: embeddings-backend
    app.kubernetes.io/part-of: local-ai-embeddings
  annotations:
    atius.com/deployment-status: proposal-only-not-applied
    embeddings.atius.com.br/model-id: Qwen/Qwen3-Embedding-0.6B
    embeddings.atius.com.br/revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
    embeddings.atius.com.br/served-model-name: qwen3-embedding-0.6b-fp16-v1
    embeddings.atius.com.br/dimensions: "32-1024-mrl"
    embeddings.atius.com.br/default-dimensions: "1024"
    embeddings.atius.com.br/quantization: fp16
    embeddings.atius.com.br/max-input-tokens: "1024"
    embeddings.atius.com.br/cpu-request: 500m
    embeddings.atius.com.br/cpu-limit: 500m
    embeddings.atius.com.br/cpu-total-min-replicas: 1000m
    embeddings.atius.com.br/cpu-total-max-replicas: 2000m
    embeddings.atius.com.br/autoscaling: "2-4"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tei-qwen-fp16
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tei-qwen-fp16
        app.kubernetes.io/component: embeddings-backend
        app.kubernetes.io/part-of: local-ai-embeddings
    spec:
      nodeSelector:
        kubernetes.io/hostname: horistic-srv
      tolerations:
        - key: atius.com/manual-only
          operator: Equal
          value: "true"
          effect: NoSchedule
      terminationGracePeriodSeconds: 30
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-latest@sha256:16c0a827cf79d5dc9b9ec1b0b5df7ffd165726f9bdf1daa9d4f7a355dd842f7e
          imagePullPolicy: IfNotPresent
          args:
            - --model-id
            - Qwen/Qwen3-Embedding-0.6B
            - --revision
            - 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
            - --served-model-name
            - qwen3-embedding-0.6b-fp16-v1
            - --dtype
            - float16
            - --pooling
            - last-token
            - --tokenization-workers
            - "1"
            - --max-concurrent-requests
            - "4"
            - --max-batch-tokens
            - "1024"
            - --max-client-batch-size
            - "4"
            - --hostname
            - 0.0.0.0
            - --port
            - "8080"
            - --prometheus-port
            - "9000"
            - --huggingface-hub-cache
            - /cache/huggingface
          env:
            - name: OMP_NUM_THREADS
              value: "1"
            - name: RAYON_NUM_THREADS
              value: "1"
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9000
          resources:
            requests:
              cpu: 500m
              memory: 3Gi
            limits:
              cpu: 500m
              memory: 5Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 6
            periodSeconds: 20
            timeoutSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: model-cache
              mountPath: /cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: qwen-huggingface-cache
---
apiVersion: v1
kind: Service
metadata:
  name: tei-qwen-fp16
  namespace: embeddings-qwen
  annotations:
    embeddings.atius.com.br/proposed-base-url: http://10.21.1.21:31222
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: tei-qwen-fp16
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 31222
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tei-qwen-fp16
  namespace: embeddings-qwen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tei-qwen-fp16
  minReplicas: 2
  maxReplicas: 4
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: tei
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tei-qwen-fp16
  namespace: embeddings-qwen
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tei-qwen-fp16
