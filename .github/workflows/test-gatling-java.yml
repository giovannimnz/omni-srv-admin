name: Performance Tests (Gatling + Java)

on:
  schedule:
    - cron: '0 4 * * 1-5' # Roda em dias úteis às 04:00 UTC (madrugada)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gatling-performance:
    name: Run Gatling Performance Tests (Java 21)
    runs-on: [self-hosted, linux, atius-srv-4]
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Load Secrets from HashiCorp Vault
        shell: bash
        run: |
          chmod +x ./scripts/ci/*.sh
          ./scripts/ci/vault-load-secrets.sh pipeline

      - name: Execute Gatling Performance Benchmarks
        shell: bash
        run: |
          ./scripts/ci/run-gatling-performance.sh

      - name: Upload Gatling Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gatling-report
          path: target/gatling/results/
          if-no-files-found: ignore
          retention-days: 14
