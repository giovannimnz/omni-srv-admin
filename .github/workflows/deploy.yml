name: Governed Deploy Pipeline (DEV & PRD)

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment (dev / prd)'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prd

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Atius Fleet K3s (${{ inputs.target_env || (github.ref == 'refs/heads/main' && 'prd' || 'dev') }})
    runs-on: [self-hosted, linux, atius-srv-4]
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Load Secrets from HashiCorp Vault
        shell: bash
        run: |
          chmod +x ./scripts/ci/*.sh
          ./scripts/ci/vault-load-secrets.sh pipeline

      - name: Execute Governed Deploy
        shell: bash
        run: |
          TARGET_ENV="${{ inputs.target_env || (github.ref == 'refs/heads/main' && 'prd' || 'dev') }}"
          echo "==> Triggering governed deploy for environment: $TARGET_ENV"
          ./scripts/ci/deploy-governed.sh "$TARGET_ENV"
