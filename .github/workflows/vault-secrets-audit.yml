name: HashiCorp Vault Secrets Audit

on:
  schedule:
    - cron: '0 2 * * *' # Diário às 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vault-audit:
    name: Audit HashiCorp Vault Secrets Integration
    runs-on: [self-hosted, linux, atius-srv-4]
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Vault Connectivity & Secrets
        shell: bash
        run: |
          chmod +x ./scripts/ci/*.sh
          echo "==> Verificando conexão e perfil da pipeline no HashiCorp Vault..."
          ./scripts/ci/vault-load-secrets.sh pipeline
          echo "==> Vault status audit: PASS"
