name: Fleet Sync & Integrity Guard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  fleet_sync_audit:
    name: Verify Repository Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Git Tree & Head SHA
        run: |
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Author: ${{ github.actor }}"
          git status --short
          echo "Repository integrity verified for fleet distribution."
