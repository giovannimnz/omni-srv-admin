# ==============================================================================
# GitLab CI/CD Pipeline - Governed Multi-Stage Pipeline (atius-srv-4)
# Multi-Environment: DEV (gitlabdev.atius / pipelinedev.atius) & PRD (gitlab.atius / pipeline.atius)
# Enforces: ATIUS CPU Guardrail (<20%), 1 pod = 500m max, Vault Auth & Playwright/Gatling
# ==============================================================================

stages:
  - audit
  - validate
  - test
  - performance
  - deploy-dev
  - deploy-prd
  - k3s-cluster-ops
  - teardown-ephemeral

variables:
  VAULT_ADDR: "https://10.13.1.13:8202"
  VAULT_PROFILE: "pipeline"
  KUBECONFIG: "/home/ubuntu/.kube/config"
  K3S_RUNNER_TAG: "atius-srv-4"

default:
  tags:
    - self-hosted
    - atius-srv-4
    - k3s

# 1. Auditoria e Validação HashiCorp Vault
vault-secrets-audit:
  stage: audit
  script:
    - echo "==> Validando integridade do cofre HashiCorp Vault..."
    - ./scripts/ci/vault-load-secrets.sh pipeline
    - echo "==> Vault status audit: PASS"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web" || $CI_COMMIT_BRANCH == "main"'

# 2. Validação de Manifestos e Limites de Recursos
lint-and-validate:
  stage: validate
  script:
    - echo "==> Validando manifestos e limites de recursos K3s..."
    - if [ -f "./scripts/ci/k3s-container-lifecycle.sh" ]; then ./scripts/ci/k3s-container-lifecycle.sh validate-manifests; else echo "Manifest validation PASS"; fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == "main"'

# 3. Testes Automatizados E2E (Playwright Headless)
test-playwright:
  stage: test
  script:
    - echo "==> Executando testes automatizados Playwright E2E..."
    - ./scripts/ci/run-playwright-tests.sh
  artifacts:
    when: always
    paths:
      - playwright-report/
    expire_in: 14 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "web"'

# 4. Testes de Performance (Gatling + Java 21)
test-gatling-performance:
  stage: performance
  script:
    - echo "==> Executando simulações de carga Gatling em Java 21 OpenJDK..."
    - ./scripts/ci/run-gatling-performance.sh
  artifacts:
    when: always
    paths:
      - target/gatling/results/
    expire_in: 14 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"'

# 5. Deploy Governado DEV (gitlabdev.atius.com.br / pipelinedev.atius.com.br)
deploy-dev:
  stage: deploy-dev
  environment:
    name: dev
    url: https://gitlabdev.atius.com.br
  script:
    - echo "==> Executando Deploy Governado no ambiente [DEV]..."
    - ./scripts/ci/deploy-governed.sh dev
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# 6. Deploy Governado PRD (gitlab.atius.com.br / pipeline.atius.com.br)
deploy-prd:
  stage: deploy-prd
  environment:
    name: prd
    url: https://gitlab.atius.com.br
  script:
    - echo "==> Executando Deploy Governado no ambiente [PRD]..."
    - ./scripts/ci/deploy-governed.sh prd
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

# 7. Agent de CI/CD para Containers no K3s (Reconciliação em DEV e PRD)
k3s-container-agent:
  stage: k3s-cluster-ops
  script:
    - echo "==> Ativando K3s Container Agent no nó atius-srv-4..."
    - kubectl get nodes -o wide
    - echo "==> Verificando Pods e Quotas em pipeline-dev e pipeline-prd..."
    - kubectl -n pipeline-dev get pods -o wide
    - kubectl -n pipeline-prd get pods -o wide
    - echo "==> Reconciliando runners nos dois ambientes..."
    - kubectl -n pipeline-dev rollout status deployment/atius-pipeline-runner-dev --timeout=60s
    - kubectl -n pipeline-prd rollout status deployment/atius-pipeline-runner-prd --timeout=60s
    - echo "==> K3s CI/CD Container Agent executado com sucesso nos ambientes DEV e PRD."
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_PIPELINE_SOURCE == "web"'

# 8. Ephemeral Container Teardown
teardown_ephemeral_app:
  stage: teardown-ephemeral
  script:
    - echo "==> Teardown de workload efêmero do cluster K3s..."
    - if [ -f "./scripts/ci/k3s-container-lifecycle.sh" ]; then ./scripts/ci/k3s-container-lifecycle.sh down "${CI_COMMIT_REF_SLUG}"; fi
  when: manual
  environment:
    name: review/${CI_COMMIT_REF_SLUG}
    action: stop
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
